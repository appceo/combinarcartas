<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidador de Cartas - Definitivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- pdf-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- Mammoth (para DOCX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            <h1 class="text-2xl font-bold text-indigo-700 mb-2">Unificador de Cartas v3.0</h1>
            <p class="text-slate-600 text-sm">
                Procesamiento directo de Google Sheets, PDF, DOCX, JPG y PNG.
            </p>
        </div>

        <!-- Formulario -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Opción A: Enlace de Google Sheets:</label>
                <input type="url" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/1R1M.../edit?gid=1157002826" class="w-full text-sm border-slate-300 rounded-lg p-2.5 border" />
            </div>

            <div class="text-center font-bold text-slate-400 text-xs">--- O ---</div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Opción B: Archivo Excel o CSV Local:</label>
                <input type="file" id="dataFile" accept=".csv, .xlsx, .xls" class="block w-full text-sm text-slate-500 border border-slate-300 rounded-lg cursor-pointer file:mr-4 file:py-2 file:px-4 file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Posición del Sello:</label>
                    <select id="labelPosition" class="w-full text-sm border-slate-300 rounded-lg p-2 border">
                        <option value="bottom-right">Esquina Inferior Derecha</option>
                        <option value="top-right">Esquina Superior Derecha</option>
                        <option value="top-left">Esquina Superior Izquierda</option>
                        <option value="bottom-left">Esquina Inferior Izquierda</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Timeout por Archivo (Segundos):</label>
                    <input type="number" id="timeoutSec" value="8" min="2" max="20" class="w-full text-sm border-slate-300 rounded-lg p-2 border" />
                </div>
            </div>

            <button id="processBtn" class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition duration-200 mt-4">
                Iniciar Procesamiento
            </button>
        </div>

        <!-- Consola y Progreso -->
        <div id="statusCard" class="hidden bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-3" id="statusTitle">Procesando...</h2>
            <div class="w-full bg-slate-200 rounded-full h-3 mb-4 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div id="statusText" class="text-xs font-mono bg-slate-900 text-green-400 p-4 rounded-lg h-64 overflow-y-auto leading-relaxed whitespace-pre-wrap"></div>
        </div>

        <!-- Descarga -->
        <div id="downloadCard" class="hidden bg-emerald-50 rounded-xl shadow-md p-6 border border-emerald-200 text-center">
            <h2 class="text-xl font-bold text-emerald-800 mb-2">¡Proceso Finalizado!</h2>
            <p id="downloadSummary" class="text-emerald-700 text-sm mb-4"></p>
            <a id="downloadBtn" class="inline-flex items-center gap-2 py-3 px-8 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-lg transition duration-200 cursor-pointer">
                Descargar PDF Consolidado
            </a>
        </div>
    </div>

    <div id="wordRenderBox" style="position: absolute; left: -9999px; top: -9999px; width: 750px; background: white; padding: 20px;"></div>

    <script>
        const processBtn = document.getElementById('processBtn');
        const csvUrlInput = document.getElementById('csvUrl');
        const dataFileInput = document.getElementById('dataFile');
        const statusCard = document.getElementById('statusCard');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const statusTitle = document.getElementById('statusTitle');
        const downloadCard = document.getElementById('downloadCard');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadSummary = document.getElementById('downloadSummary');
        const wordRenderBox = document.getElementById('wordRenderBox');

        processBtn.addEventListener('click', async () => {
            let rowsData = [];
            const rawUrl = csvUrlInput.value.trim();
            const localFile = dataFileInput.files[0];

            statusCard.classList.remove('hidden');
            downloadCard.classList.add('hidden');
            statusText.innerText = "";

            if (rawUrl) {
                logStatus("Obteniendo datos desde Google Sheets...");
                try {
                    const csvText = await obtenerCSVGoogleSheets(rawUrl);
                    const workbook = XLSX.read(csvText, { type: 'string' });
                    rowsData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                } catch (e) {
                    alert("Error al leer Google Sheets: " + e.message);
                    return;
                }
            } else if (localFile) {
                try {
                    const data = await localFile.arrayBuffer();
                    const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                    rowsData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                } catch (e) {
                    alert("Error al leer el archivo local: " + e.message);
                    return;
                }
            } else {
                alert("Por favor ingresa una URL de Google Sheets o sube un archivo Excel.");
                return;
            }

            if (rowsData.length === 0) {
                alert("No se encontraron registros en el archivo.");
                return;
            }

            const { PDFDocument, rgb } = PDFLib;
            let mergedPdf = await PDFDocument.create();
            const position = document.getElementById('labelPosition').value;
            const timeoutSeconds = parseInt(document.getElementById('timeoutSec').value) * 1000;

            processBtn.disabled = true;
            logStatus(`Lectura exitosa: ${rowsData.length} registros cargados.\nIniciando procesamiento de archivos...\n`);

            let exitosos = 0;
            let omitidos = 0;

            for (let i = 0; i < rowsData.length; i++) {
                const row = rowsData[i];
                progressBar.style.width = `${Math.round(((i + 1) / rowsData.length) * 100)}%`;

                const remNom = getValFlexible(row, ['remitentenombre', 'remitente_nombre', 'nombre_remitente']);
                const remApe = getValFlexible(row, ['remitenteapellidos', 'remitente_apellidos', 'apellidos_remitente']);
                const destNom = getValFlexible(row, ['destinatarionombre', 'destinatario_nombre', 'nombre_destinatario']);
                const destApe = getValFlexible(row, ['destinatarioapellidos', 'destinatario_apellidos', 'apellidos_destinatario']);
                const idEntrada = getValFlexible(row, ['identrada', 'id_de_entrada', 'id', 'id_entrada']) || 'N/A';
                let fileUrl = getValFlexible(row, ['carta', 'url', 'enlace', 'adjunto', 'cartas', 'link']);

                const remitente = `${remNom} ${remApe}`.trim() || 'No especificado';
                const destinatario = `${destNom} ${destApe}`.trim() || 'No especificado';

                logStatus(`[${i + 1}/${rowsData.length}] ID: ${idEntrada} | ${remitente} -> ${destinatario}`);

                await new Promise(r => setTimeout(r, 30));

                if (!fileUrl || !fileUrl.startsWith('http')) {
                    logStatus(`  ⚠️ Omitido: URL inválida o vacía.`);
                    omitidos++;
                    continue;
                }

                // Normalización de enlaces de Google Drive
                fileUrl = normalizarUrlDrive(fileUrl);

                try {
                    const buffer = await descargarArchivoSmarter(fileUrl, timeoutSeconds);
                    if (!buffer || buffer.byteLength < 50) {
                        throw new Error("El archivo descargado está vacío o no es válido.");
                    }

                    const tipo = detectarTipoArchivo(buffer, fileUrl);

                    if (tipo === 'pdf') {
                        const loadedPdf = await PDFDocument.load(buffer, { ignoreEncryption: true });
                        const pages = await mergedPdf.copyPages(loadedPdf, loadedPdf.getPageIndices());
                        pages.forEach(p => {
                            stampHeader(p, remitente, destinatario, idEntrada, position, rgb);
                            mergedPdf.addPage(p);
                        });
                        logStatus(`  ✅ Documento PDF procesado (${pages.length} pág).`);
                        exitosos++;

                    } else if (tipo === 'docx') {
                        wordRenderBox.innerHTML = '';
                        const parsed = await mammoth.convertToHtml({ arrayBuffer: buffer });
                        wordRenderBox.innerHTML = parsed.value;

                        await new Promise(r => setTimeout(r, 120));

                        const canvas = await html2canvas(wordRenderBox, { scale: 1.2, logging: false });
                        const imgDataUrl = canvas.toDataURL('image/png');
                        const imgEmbed = await mergedPdf.embedPng(imgDataUrl);

                        const page = mergedPdf.addPage([canvas.width, canvas.height]);
                        page.drawImage(imgEmbed, { x: 0, y: 0, width: canvas.width, height: canvas.height });
                        stampHeader(page, remitente, destinatario, idEntrada, position, rgb);

                        wordRenderBox.innerHTML = '';
                        logStatus(`  ✅ Documento Word (.docx) procesado.`);
                        exitosos++;

                    } else {
                        const imgDataUrl = await bufferToDataUrl(buffer);
                        let imgEmbed;
                        if (imgDataUrl.startsWith('data:image/jpeg') || imgDataUrl.startsWith('data:image/jpg')) {
                            imgEmbed = await mergedPdf.embedJpg(imgDataUrl);
                        } else {
                            imgEmbed = await mergedPdf.embedPng(imgDataUrl);
                        }

                        const page = mergedPdf.addPage([imgEmbed.width, imgEmbed.height]);
                        page.drawImage(imgEmbed, { x: 0, y: 0, width: imgEmbed.width, height: imgEmbed.height });
                        stampHeader(page, remitente, destinatario, idEntrada, position, rgb);
                        logStatus(`  ✅ Imagen (JPG/PNG) integrada.`);
                        exitosos++;
                    }

                } catch (err) {
                    logStatus(`  ❌ Error al procesar archivo: ${err.message}`);
                    omitidos++;
                }
            }

            logStatus(`\n==========================================`);
            logStatus(`Proceso completado. Éxitos: ${exitosos} | Omitidos: ${omitidos}`);

            if (exitosos > 0) {
                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.download = `Cartas_Consolidadas.pdf`;
                downloadSummary.innerText = `Se unieron ${exitosos} cartas correctamente.`;
                statusTitle.innerText = "¡Proceso Completado!";
                downloadCard.classList.remove('hidden');
            } else {
                statusTitle.innerText = "Proceso terminado sin archivos";
                alert("No se pudo procesar ningún archivo. Asegúrate de que las URLs de las cartas sean públicas.");
            }

            processBtn.disabled = false;
        });

        async function obtenerCSVGoogleSheets(url) {
            const sheetIdMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (!sheetIdMatch || !sheetIdMatch[1]) {
                throw new Error("No se reconoció el ID de Google Sheets en la URL.");
            }
            const docId = sheetIdMatch[1];
            
            let gidParam = "";
            const gidMatch = url.match(/[?&]gid=([0-9]+)/);
            if (gidMatch && gidMatch[1]) {
                gidParam = `&gid=${gidMatch[1]}`;
            }

            // URL nativa de exportación que evade problemas de CORS en la mayoría de navegadores
            const directGvizUrl = `https://docs.google.com/spreadsheets/d/${docId}/gviz/tq?tqx=out:csv${gidParam}`;

            try {
                const res = await fetch(directGvizUrl);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.startsWith('<!DOCTYPE html>')) {
                        return text;
                    }
                }
            } catch (e) { }

            // Fallback mediante proxy si la llamada directa es bloqueada
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directGvizUrl)}`;
            const resProxy = await fetch(proxyUrl);
            if (resProxy.ok) {
                const text = await resProxy.text();
                if (!text.startsWith('<!DOCTYPE html>')) {
                    return text;
                }
            }
            throw new Error("No se pudo descargar el documento. Verifica que el archivo en Google Drive tenga permiso de acceso público ('Cualquier persona con el enlace').");
        }

        function normalizarUrlDrive(url) {
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            return url;
        }

        async function descargarArchivoSmarter(url, timeoutMs) {
            // Intentar primero descarga directa nativa
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                if (res.ok) {
                    return await res.arrayBuffer();
                }
            } catch (e) {
                clearTimeout(timer);
            }

            // Si falla por CORS, intentar a través de Proxies
            const proxies = [
                "https://api.allorigins.win/raw?url=",
                "https://corsproxy.io/?"
            ];

            for (let proxy of proxies) {
                const proxyController = new AbortController();
                const proxyTimer = setTimeout(() => proxyController.abort(), timeoutMs);
                try {
                    const res = await fetch(proxy + encodeURIComponent(url), { signal: proxyController.signal });
                    clearTimeout(proxyTimer);
                    if (res.ok) {
                        return await res.arrayBuffer();
                    }
                } catch (e) {
                    clearTimeout(proxyTimer);
                }
            }
            throw new Error("No se pudo descargar el archivo (CORS o enlace no público).");
        }

        function detectarTipoArchivo(buf, url) {
            const u = new Uint8Array(buf.slice(0, 4));
            if (u[0] === 0x25 && u[1] === 0x50 && u[2] === 0x44 && u[3] === 0x46) return 'pdf';
            if ((u[0] === 0x50 && u[1] === 0x4B) || url.toLowerCase().includes('.docx')) return 'docx';
            return 'imagen';
        }

        function bufferToDataUrl(buffer) {
            return new Promise((resolve) => {
                const blob = new Blob([buffer]);
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function getValFlexible(row, targetKeys) {
            for (let key in row) {
                const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let target of targetKeys) {
                    if (cleanKey === target || cleanKey.includes(target)) {
                        return String(row[key]).trim();
                    }
                }
            }
            return '';
        }

        function stampHeader(page, remitente, destinatario, idEntrada, position, rgb) {
            const { width, height } = page.getSize();
            const fontSize = 9;
            const lineHeight = 12;
            let x = 20;
            let y = height - 20;

            if (position.includes('right')) x = Math.max(20, width - 230);
            if (position.includes('bottom')) y = 50;

            page.drawRectangle({
                x: x - 5,
                y: y - (lineHeight * 2) - 5,
                width: 225,
                height: (lineHeight * 3) + 6,
                color: rgb(1, 1, 1),
                opacity: 0.9,
                borderColor: rgb(0.5, 0.5, 0.5),
                borderWidth: 1,
            });

            page.drawText(`ID Entrada: ${idEntrada}`, { x, y, size: fontSize, color: rgb(0, 0, 0) });
            page.drawText(`Remitente: ${remitente.substring(0, 35)}`, { x, y: y - lineHeight, size: fontSize, color: rgb(0.1, 0.1, 0.1) });
            page.drawText(`Destinatario: ${destinatario.substring(0, 35)}`, { x, y: y - (lineHeight * 2), size: fontSize, color: rgb(0.1, 0.1, 0.1) });
        }

        function logStatus(msg) {
            statusText.innerText += msg + '\n';
            statusText.scrollTop = statusText.scrollHeight;
        }
    </script>
</body>
</html>
