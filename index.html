<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consolidador de Cartas y Documentos</title>
  <!-- Tailwind CSS para diseño profesional -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse para procesar CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- SheetJS para procesar Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- PDF-Lib para manipular y unificar PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- font-awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Encabezado -->
  <header class="bg-indigo-700 text-white shadow-lg py-6 px-8">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-file-pdf text-3xl text-indigo-200"></i>
        <div>
          <h1 class="text-2xl font-bold">Consolidador de Cartas</h1>
          <p class="text-xs text-indigo-200">Generador de paquete único unificado en PDF</p>
        </div>
      </div>
      <span class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1 rounded-full font-medium">Versión Web 1.0</span>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-5xl mx-auto w-full flex-1 p-6 space-y-6">

    <!-- Card de Entrada de Datos -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-2">
        <i class="fa-solid fa-database text-indigo-600"></i> Origen de Datos
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Opción 1: Enlace URL -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-slate-700">Enlace a la Base de Datos (CSV/Excel Público)</label>
          <div class="relative">
            <input type="url" id="dbUrl" placeholder="https://ejemplo.com/datos.csv o Google Sheets CSV" 
                   class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <i class="fa-solid fa-link absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          </div>
          <p class="text-xs text-slate-500">Soporta enlaces directos a CSV o publicados desde Google Sheets.</p>
        </div>

        <!-- Opción 2: Archivo Local -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-slate-700">O Cargar Archivo Excel / CSV Local</label>
          <input type="file" id="dbFile" accept=".csv, .xlsx, .xls" 
                 class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-300 rounded-lg cursor-pointer">
        </div>
      </div>

      <!-- Botón de Procesamiento -->
      <div class="pt-2 flex justify-end">
        <button id="btnStart" onclick="procesarRegistros()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition duration-200 flex items-center gap-2">
          <i class="fa-solid fa-gear"></i> Iniciar Consolidación
        </button>
      </div>
    </section>

    <!-- Estado y Progreso -->
    <section id="statusCard" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-2">
        <i class="fa-solid fa-spinner text-indigo-600 animate-spin" id="spinner"></i> Estado del Proceso
      </h2>
      <p id="statusMessage" class="text-sm text-slate-600">Cargando base de datos...</p>
      
      <!-- Barra de Progreso -->
      <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-3 w-0 transition-all duration-300"></div>
      </div>
      <div id="logContainer" class="bg-slate-900 text-green-400 p-4 rounded-lg text-xs font-mono h-40 overflow-y-auto space-y-1">
        <div>> Sistema listo. Esperando inicio...</div>
      </div>
    </section>

  </main>

  <!-- Lógica JavaScript -->
  <script>
    const log = (msg) => {
      const container = document.getElementById('logContainer');
      const entry = document.createElement('div');
      entry.textContent = `> ${msg}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    };

    const updateStatus = (msg, percent) => {
      document.getElementById('statusMessage').textContent = msg;
      document.getElementById('progressBar').style.width = `${percent}%`;
      log(msg);
    };

    async function procesarRegistros() {
      const urlInput = document.getElementById('dbUrl').value.trim();
      const fileInput = document.getElementById('dbFile').files[0];

      if (!urlInput && !fileInput) {
        alert('Por favor, ingresa un enlace a la base de datos o sube un archivo Excel/CSV.');
        return;
      }

      document.getElementById('statusCard').classList.remove('hidden');
      updateStatus('Leyendo base de datos...', 5);

      try {
        let rows = [];
        if (fileInput) {
          rows = await parseLocalFile(fileInput);
        } else {
          rows = await fetchRemoteData(urlInput);
        }

        if (!rows || rows.length === 0) {
          throw new Error('No se encontraron registros validos en la base de datos.');
        }

        log(`Se encontraron ${rows.length} registros para procesar.`);
        await generarPDFConsolidado(rows);

      } catch (err) {
        log(`ERROR: ${err.message}`);
        document.getElementById('spinner').classList.remove('animate-spin');
        document.getElementById('spinner').classList.add('text-red-500');
        alert(`Ocurrió un error: ${err.message}`);
      }
    }

    // Parsear archivo local (Excel / CSV)
    function parseLocalFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.SheetNames[0];
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
          resolve(json);
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    // Fetch datos desde enlace
    async function fetchRemoteData(url) {
      const res = await fetch(url);
      const text = await res.text();
      return new Promise((resolve) => {
        Papa.parse(text, {
          header: true,
          skipEmptyLines: true,
          complete: (results) => resolve(results.data)
        });
      });
    }

    // Generar PDF Unificado
    async function generarPDFConsolidado(registros) {
      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const pdfMaestro = await PDFDocument.create();
      const font = await pdfMaestro.embedFont(StandardFonts.HelveticaBold);
      const fontRegular = await pdfMaestro.embedFont(StandardFonts.Helvetica);

      const total = registros.length;

      for (let i = 0; i < total; i++) {
        const reg = registros[i];
        const stepPercent = Math.round(((i + 1) / total) * 90);
        
        // Mapeo flexible de columnas
        const id = reg.ID || reg.id || reg.Registro || `REG-${i+1}`;
        const remNombre = reg.Nombre_Remitente || reg.Remitente_Nombre || reg.Remitente || '';
        const remApellido = reg.Apellido_Remitente || reg.Remitente_Apellido || '';
        const destNombre = reg.Nombre_Destinatario || reg.Destinatario_Nombre || reg.Destinatario || '';
        const destApellido = reg.Apellido_Destinatario || reg.Destinatario_Apellido || '';
        const urlDoc = reg.URL || reg.Url || reg.Documento || reg.Carta || '';

        const remitente = `${remNombre} ${remApellido}`.trim();
        const destinatario = `${destNombre} ${destApellido}`.trim();

        updateStatus(`Procesando registro ${i + 1} de ${total}: ID ${id}`, stepPercent);

        if (!urlDoc) {
          log(`Advertencia: Registro ID ${id} no tiene URL de carta. Omitiendo...`);
          continue;
        }

        try {
          const res = await fetch(urlDoc);
          const blob = await res.blob();
          const buffer = await blob.arrayBuffer();
          const contentType = res.headers.get('content-type') || '';

          if (urlDoc.toLowerCase().endsWith('.pdf') || contentType.includes('pdf')) {
            // Documento PDF
            const pdfDoc = await PDFDocument.load(buffer);
            const copiedPages = await pdfMaestro.copyPages(pdfDoc, pdfDoc.getPageIndices());
            
            copiedPages.forEach((page) => {
              // Estampar Encabezado en cada página del PDF
              const { width, height } = page.getSize();
              page.drawRectangle({
                x: 0, y: height - 40, width: width, height: 40,
                color: rgb(0.95, 0.95, 0.98)
              });
              page.drawText(`ID REGISTRO: ${id} | REMITENTE: ${remitente} | DESTINATARIO: ${destinatario}`, {
                x: 15, y: height - 25, size: 9, font: font, color: rgb(0.1, 0.1, 0.3)
              });
              pdfMaestro.addPage(page);
            });

          } else if (urlDoc.toLowerCase().match(/\.(jpg|jpeg|png)$/) || contentType.includes('image')) {
            // Imagen JPG/PNG
            const page = pdfMaestro.addPage([612, 792]); // Tamaño Carta Estándar
            let img;
            if (urlDoc.toLowerCase().includes('.png') || contentType.includes('png')) {
              img = await pdfMaestro.embedPng(buffer);
            } else {
              img = await pdfMaestro.embedJpg(buffer);
            }

            // Dibujar Encabezado
            page.drawRectangle({ x: 0, y: 752, width: 612, height: 40, color: rgb(0.95, 0.95, 0.98) });
            page.drawText(`ID REGISTRO: ${id} | REMITENTE: ${remitente} | DESTINATARIO: ${destinatario}`, {
              x: 15, y: 767, size: 9, font: font, color: rgb(0.1, 0.1, 0.3)
            });

            // Ajustar imagen en la página
            const imgDims = img.scaleToFit(582, 720);
            page.drawImage(img, {
              x: 15, y: 740 - imgDims.height,
              width: imgDims.width, height: imgDims.height
            });

          } else {
            // Documento Word (.docx) o no soportado nativamente -> Portada de Referencia
            const page = pdfMaestro.addPage([612, 792]);
            page.drawRectangle({ x: 0, y: 752, width: 612, height: 40, color: rgb(0.95, 0.95, 0.98) });
            page.drawText(`ID REGISTRO: ${id} | REMITENTE: ${remitente} | DESTINATARIO: ${destinatario}`, {
              x: 15, y: 767, size: 9, font: font, color: rgb(0.1, 0.1, 0.3)
            });

            page.drawText('Documento Word Adjunto', { x: 50, y: 650, size: 18, font: font, color: rgb(0.2, 0.2, 0.2) });
            page.drawText(`El documento asignado a este registro es un archivo Word (.docx).`, { x: 50, y: 610, size: 11, font: fontRegular });
            page.drawText(`Enlace directo al documento: ${urlDoc}`, { x: 50, y: 590, size: 10, font: fontRegular, color: rgb(0, 0, 0.8) });
          }

        } catch (fileErr) {
          log(`Error descargando o uniendo archivo ID ${id}: ${fileErr.message}`);
        }
      }

      updateStatus('Compilando paquete PDF unificado final...', 95);
      const pdfBytes = await pdfMaestro.save();

      // Disparar Descarga
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Paquete_Cartas_Unificadas_${Date.now()}.pdf`;
      link.click();

      updateStatus('¡Proceso completado con éxito! Se ha descargado el paquete.', 100);
      document.getElementById('spinner').classList.remove('animate-spin');
      document.getElementById('spinner').classList.add('text-green-500');
    }
  </script>
</body>
</html>
