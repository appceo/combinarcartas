<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unificador Ultra Rápido de Cartas</title>
    
    <!-- JSZip para compresión y descompresión ultrarrápida -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- PDF-Lib para manipulacion y unificacion de PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { margin-top: 0; color: #0f172a; font-size: 1.75rem; margin-bottom: 8px; }
        p.subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.95rem; }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }

        input[type="url"], input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;
        }

        .divider { text-align: center; margin: 20px 0; position: relative; }
        .divider::before {
            content: ""; position: absolute; top: 50%; left: 0; right: 0;
            height: 1px; background-color: var(--border-color); z-index: 1;
        }
        .divider span {
            background-color: var(--card-bg); padding: 0 12px; position: relative;
            z-index: 2; color: #94a3b8; font-size: 0.85rem; font-weight: 600;
        }

        button.action-btn {
            width: 100%; background-color: var(--primary-color); color: white;
            border: none; padding: 14px; font-size: 1rem; font-weight: 600;
            border-radius: 6px; cursor: pointer; transition: background-color 0.2s;
        }
        button.action-btn:hover { background-color: var(--primary-hover); }
        button.action-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .status-box { margin-top: 24px; padding: 16px; border-radius: 6px; background-color: #f1f5f9; display: none; }
        .progress-bar-container { width: 100%; background-color: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background-color: var(--primary-color); transition: width 0.15s ease; }
        .log-list {
            margin-top: 12px; max-height: 180px; overflow-y: auto; font-family: monospace;
            font-size: 0.85rem; color: #334155; background: #fff; padding: 8px;
            border: 1px solid var(--border-color); border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Unificador Ultra Rápido de Cartas</h1>
    <p class="subtitle">Procesamiento paralelo optimizado de alto rendimiento.</p>

    <!-- Navegación de Pasos -->
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPaso(1)">PASO 1: Descargar Cartas en ZIP</button>
        <button class="tab-btn" onclick="cambiarPaso(2)">PASO 2: Generar PDF Unificado</button>
    </div>

    <!-- PASO 1 -->
    <div id="paso1" class="tab-content active">
        <div class="form-group">
            <label for="csvUrl">URL de la Tabla de Datos (Google Sheets / CSV)</label>
            <input type="url" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/.../export?format=csv">
        </div>

        <div class="divider"><span>O CARGAR ARCHIVO CSV LOCAL</span></div>

        <div class="form-group">
            <label for="csvFile">Archivo CSV Local de la Tabla de Datos</label>
            <input type="file" id="csvFile" accept=".csv, .txt">
        </div>

        <button id="btnPaso1" class="action-btn" onclick="ejecutarPaso1()">Descargar Lote de Cartas (Rápido)</button>
    </div>

    <!-- PASO 2 -->
    <div id="paso2" class="tab-content">
        <div class="form-group">
            <label for="zipFile">Seleccione el Paquete ZIP Generado en el Paso 1</label>
            <input type="file" id="zipFile" accept=".zip">
        </div>

        <button id="btnPaso2" class="action-btn" onclick="ejecutarPaso2()">Generar PDF Unificado al Instante</button>
    </div>

    <!-- Estado y Logs -->
    <div id="statusBox" class="status-box">
        <span id="statusText">Iniciando proceso...</span>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="logList" class="log-list"></div>
    </div>
</div>

<script>
    function cambiarPaso(paso) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => btn.classList.toggle('active', idx === (paso - 1)));
        document.querySelectorAll('.tab-content').forEach((content, idx) => content.classList.toggle('active', idx === (paso - 1)));
        document.getElementById('statusBox').style.display = 'none';
    }

    function log(mensaje) {
        const logList = document.getElementById('logList');
        const entry = document.createElement('div');
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${mensaje}`;
        logList.appendChild(entry);
        logList.scrollTop = logList.scrollHeight;
    }

    function actualizarProgreso(porcentaje, texto) {
        document.getElementById('progressBar').style.width = `${porcentaje}%`;
        if (texto) {
            document.getElementById('statusText').textContent = texto;
            log(texto);
        }
    }

    function parsearCSV(texto) {
        const lineas = texto.split(/\r\n|\n/);
        if (lineas.length === 0) return [];
        const primeraLinea = lineas[0];
        const delimitador = primeraLinea.includes(';') ? ';' : ',';
        const encabezados = primeraLinea.split(delimitador).map(h => 
            h.trim().replace(/^"|"$/g, '').replace(/^\uFEFF/, '').toUpperCase()
        );

        const resultados = [];
        for (let i = 1; i < lineas.length; i++) {
            const linea = lineas[i].trim();
            if (!linea) continue;
            const valores = linea.split(delimitador).map(v => v.trim().replace(/^"|"$/g, ''));
            const registro = {};
            encabezados.forEach((header, index) => {
                registro[header] = valores[index] || '';
            });
            resultados.push(registro);
        }
        return resultados;
    }

    // Descarga Anti-CORS ultrarrápida con Timeout
    async function descargarDocumentoFast(urlOriginal) {
        const urlLimpia = urlOriginal.replace(/\\/g, '').trim();
        const estrategias = [
            urlLimpia,
            `https://corsproxy.io/?${encodeURIComponent(urlLimpia)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(urlLimpia)}`
        ];

        for (const urlIntento of estrategias) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000); // Max 8s por intento

                const res = await fetch(urlIntento, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const blob = await res.blob();
                    if (blob.size > 0) return blob;
                }
            } catch (e) {}
        }
        throw new Error(`Fallo en descarga: ${urlLimpia}`);
    }

    // PASO 1: Descargas Paralelas por Lotes
    async function ejecutarPaso1() {
        let csvUrl = document.getElementById('csvUrl').value.trim();
        const csvFileInput = document.getElementById('csvFile').files[0];
        const btn = document.getElementById('btnPaso1');

        if (!csvUrl && !csvFileInput) {
            alert("Por favor ingrese una URL o seleccione un archivo CSV local.");
            return;
        }

        btn.disabled = true;
        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('logList').innerHTML = '';
        actualizarProgreso(0, "Leyendo tabla de datos...");

        try {
            let csvContent = "";
            if (csvFileInput) {
                csvContent = await csvFileInput.text();
            } else {
                if (csvUrl.includes('docs.google.com/spreadsheets')) {
                    csvUrl = csvUrl.replace(/\/edit(\?.*)?$/, '/export?format=csv');
                }
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error("No se pudo descargar el CSV.");
                csvContent = await response.text();
            }

            const registros = parsearCSV(csvContent);
            if (!registros || registros.length === 0) throw new Error("Tabla sin registros.");

            log(`Procesando ${registros.length} registros en paralelo...`);
            const zip = new JSZip();

            const CONCURRENCIA = 8; // 8 descargas simultáneas
            let completados = 0;

            for (let i = 0; i < registros.length; i += CONCURRENCIA) {
                const lote = registros.slice(i, i + CONCURRENCIA);

                await Promise.all(lote.map(async (fila, idxLote) => {
                    const idxReal = i + idxLote;
                    const idEntrada = fila['ID DE ENTRADA'] || fila['ID ENTRADA'] || fila['ID'] || `${idxReal+1}`;
                    const nombreDest = fila['NOMBRE DESTINATARIO'] || '';
                    const apellidoDest = fila['APELLIDO DESTINATARIO'] || fila['APELLIDOS DESTINATARIO'] || '';
                    const nombreRem = fila['NOMBRE REMITENTE'] || '';
                    const apellidoRem = fila['APELLIDOS REMITENTE'] || fila['APELLIDO REMITENTE'] || '';
                    const cartaUrl = fila['CARTA'] || fila['URL'] || fila['CARTA URL'];

                    const dest = `${nombreDest} ${apellidoDest}`.trim().replace(/[/\\?%*:|"<>]/g, '');
                    const rem = `${nombreRem} ${apellidoRem}`.trim().replace(/[/\\?%*:|"<>]/g, '');

                    if (cartaUrl) {
                        try {
                            const blob = await descargarDocumentoFast(cartaUrl);
                            const urlLimpia = cartaUrl.toLowerCase().split('?')[0];
                            const ext = urlLimpia.endsWith('.png') ? 'png' : 
                                       (urlLimpia.endsWith('.jpg') || urlLimpia.endsWith('.jpeg')) ? 'jpg' : 'pdf';

                            const nombreArchivoZip = `${idEntrada}___${rem}___${dest}.${ext}`;
                            zip.file(nombreArchivoZip, blob);
                        } catch (err) {
                            log(`[OMITIDO] Error ID ${idEntrada}: ${err.message}`);
                        }
                    }

                    completados++;
                    const porcentaje = Math.round((completados / registros.length) * 100);
                    actualizarProgreso(porcentaje, `Descargadas ${completados} de ${registros.length} cartas...`);
                }));
            }

            actualizarProgreso(95, "Creando paquete ZIP...");
            const zipContent = await zip.generateAsync({ type: "blob", compression: "STORE" }); // Sin compresión pesada para máximo rendimiento

            const linkDescarga = document.createElement('a');
            linkDescarga.href = URL.createObjectURL(zipContent);
            linkDescarga.download = `Paquete_Cartas.zip`;
            document.body.appendChild(linkDescarga);
            linkDescarga.click();
            document.body.removeChild(linkDescarga);

            actualizarProgreso(100, "¡Paso 1 Completado! Guarde el archivo ZIP y proceda al PASO 2.");

        } catch (error) {
            actualizarProgreso(0, `Error en Paso 1: ${error.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // PASO 2: Unificación Ultra Rápida
    async function ejecutarPaso2() {
        const zipInput = document.getElementById('zipFile').files[0];
        const btn = document.getElementById('btnPaso2');

        if (!zipInput) {
            alert("Por favor seleccione el archivo .ZIP descargado en el Paso 1.");
            return;
        }

        btn.disabled = true;
        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('logList').innerHTML = '';
        actualizarProgreso(0, "Descomprimiendo paquete ZIP en memoria...");

        try {
            const zip = new JSZip();
            const zipLoaded = await zip.loadAsync(zipInput);

            const archivos = [];
            zipLoaded.forEach((relativePath, zipEntry) => {
                if (!zipEntry.dir) archivos.push(zipEntry);
            });

            log(`Compilando ${archivos.length} archivos en un solo PDF...`);

            const pdfUnificado = await PDFLib.PDFDocument.create();
            const helveticaFont = await pdfUnificado.embedFont(PDFLib.StandardFonts.HelveticaBold);

            for (let i = 0; i < archivos.length; i++) {
                const archivo = archivos[i];
                const nombreArchivo = archivo.name.split('/').pop();

                const porcentaje = Math.round(((i + 1) / archivos.length) * 100);
                actualizarProgreso(porcentaje, `Unificando carta ${i + 1} de ${archivos.length}...`);

                const partes = nombreArchivo.replace(/\.[^/.]+$/, "").split('___');
                const idEntrada = partes[0] || 'N/A';
                const remitente = partes[1] || 'Sin Nombre';
                const destinatario = partes[2] || 'Sin Nombre';

                const textoEtiqueta = `ID Entrada: ${idEntrada} | Remitente: ${remitente} | Destinatario: ${destinatario}`;

                const arrayBuffer = await archivo.async("arraybuffer");
                const ext = nombreArchivo.split('.').pop().toLowerCase();

                if (ext === 'pdf') {
                    const pdfFuente = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const paginasCopiadas = await pdfUnificado.copyPages(pdfFuente, pdfFuente.getPageIndices());

                    paginasCopiadas.forEach(pagina => {
                        pdfUnificado.addPage(pagina);
                        const { width } = pagina.getSize();

                        pagina.drawRectangle({
                            x: 0, y: 0, width: width, height: 26,
                            color: PDFLib.rgb(0.93, 0.93, 0.93), opacity: 0.95
                        });

                        pagina.drawText(textoEtiqueta, {
                            x: 12, y: 8, size: 8.5,
                            font: helveticaFont, color: PDFLib.rgb(0.1, 0.1, 0.1)
                        });
                    });

                } else if (['jpg', 'jpeg', 'png'].includes(ext)) {
                    let imagenEmbed = (ext === 'png') ? 
                        await pdfUnificado.embedPng(arrayBuffer) : 
                        await pdfUnificado.embedJpg(arrayBuffer);

                    const pagina = pdfUnificado.addPage([imagenEmbed.width, imagenEmbed.height + 30]);
                    pagina.drawImage(imagenEmbed, {
                        x: 0, y: 30, width: imagenEmbed.width, height: imagenEmbed.height
                    });

                    pagina.drawRectangle({
                        x: 0, y: 0, width: imagenEmbed.width, height: 30,
                        color: PDFLib.rgb(0.93, 0.93, 0.93)
                    });

                    pagina.drawText(textoEtiqueta, {
                        x: 15, y: 10, size: 9.5,
                        font: helveticaFont, color: PDFLib.rgb(0.1, 0.1, 0.1)
                    });
                }
            }

            actualizarProgreso(98, "Generando PDF final...");
            const pdfBytes = await pdfUnificado.save();

            const blobFinal = new Blob([pdfBytes], { type: 'application/pdf' });
            const linkDescarga = document.createElement('a');
            linkDescarga.href = URL.createObjectURL(blobFinal);
            linkDescarga.download = `Cartas_Unificadas_Completo.pdf`;
            document.body.appendChild(linkDescarga);
            linkDescarga.click();
            document.body.removeChild(linkDescarga);

            actualizarProgreso(100, "¡Listo! El documento PDF unificado ha sido generado.");

        } catch (error) {
            actualizarProgreso(0, `Error en Paso 2: ${error.message}`);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
