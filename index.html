<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidador de Cartas - Cita con Dios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para leer Excel y CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- pdf-lib para manipular e integrar PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- Mammoth para leer archivos Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- Encabezado -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            <h1 class="text-2xl font-bold text-indigo-700 mb-2">Unificador de Cartas a PDF</h1>
            <p class="text-slate-600 text-sm">
                Sube tu archivo de <strong>Excel (.xlsx, .xls)</strong> o <strong>CSV</strong>. La aplicación procesará cada carta, estampará el 
                <strong>ID de entrada</strong>, <strong>Remitente</strong> y <strong>Destinatario</strong> en cada página y unirá todo en un único PDF listo para imprimir.
            </p>
        </div>

        <!-- Panel de Carga -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">Cargar archivo Excel o CSV:</label>
                <input type="file" id="dataFile" accept=".csv, .xlsx, .xls" class="block w-full text-sm text-slate-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-indigo-50 file:text-indigo-700
                    hover:file:bg-indigo-100 cursor-pointer border border-slate-300 rounded-lg"/>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-600 mb-1">Posición del Sello:</label>
                <select id="labelPosition" class="w-full text-sm border-slate-300 rounded-lg p-2 border">
                    <option value="top-right">Esquina Superior Derecha</option>
                    <option value="top-left">Esquina Superior Izquierda</option>
                    <option value="bottom-right">Esquina Inferior Derecha</option>
                    <option value="bottom-left">Esquina Inferior Izquierda</option>
                </select>
            </div>

            <button id="processBtn" disabled class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-semibold rounded-lg shadow transition duration-200">
                Procesar y Generar PDF Consolidado
            </button>
        </div>

        <!-- Barra de Progreso y Consola -->
        <div id="statusCard" class="hidden bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-3" id="statusTitle">Procesando...</h2>
            <div class="w-full bg-slate-200 rounded-full h-3 mb-4 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div id="statusText" class="text-xs font-mono bg-slate-900 text-green-400 p-4 rounded-lg h-64 overflow-y-auto leading-relaxed whitespace-pre-wrap"></div>
        </div>

        <!-- Descarga -->
        <div id="downloadCard" class="hidden bg-emerald-50 rounded-xl shadow-md p-6 border border-emerald-200 text-center">
            <h2 class="text-xl font-bold text-emerald-800 mb-2">¡Documento Final Generado!</h2>
            <p id="downloadSummary" class="text-emerald-700 text-sm mb-4"></p>
            <a id="downloadBtn" class="inline-flex items-center gap-2 py-3 px-8 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-lg transition duration-200 cursor-pointer">
                Descargar PDF Consolidado
            </a>
        </div>
    </div>

    <!-- Elemento oculto para renderizar archivos Word e Imágenes con Fallback -->
    <div id="hiddenWordRender" style="position: absolute; left: -9999px; top: -9999px; width: 750px; background: white; padding: 30px;"></div>

    <script>
        const dataFileInput = document.getElementById('dataFile');
        const processBtn = document.getElementById('processBtn');
        const statusCard = document.getElementById('statusCard');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const statusTitle = document.getElementById('statusTitle');
        const downloadCard = document.getElementById('downloadCard');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadSummary = document.getElementById('downloadSummary');

        let rowsData = [];

        dataFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheet];
                    
                    rowsData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (rowsData.length > 0) {
                        processBtn.disabled = false;
                        alert(`¡Archivo cargado con éxito! Se encontraron ${rowsData.length} registros.`);
                    } else {
                        alert("El archivo no contiene registros válidos.");
                    }
                } catch (err) {
                    alert("Error al leer el archivo Excel/CSV: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        processBtn.addEventListener('click', async () => {
            if (rowsData.length === 0) return;

            processBtn.disabled = true;
            statusCard.classList.remove('hidden');
            downloadCard.classList.add('hidden');
            progressBar.style.width = '0%';
            statusText.innerText = 'Iniciando pipeline de procesamiento...\n';

            let mergedPdf;
            try {
                mergedPdf = await PDFLib.PDFDocument.create();
            } catch (e) {
                logStatus("Error inicializando PDF: " + e.message);
                processBtn.disabled = false;
                return;
            }

            const position = document.getElementById('labelPosition').value;
            let totalExitosos = 0;
            let totalOmitidos = 0;

            for (let i = 0; i < rowsData.length; i++) {
                const row = rowsData[i];
                const progress = Math.round(((i + 1) / rowsData.length) * 100);
                progressBar.style.width = `${progress}%`;

                const remNom = getVal(row, ['REMITENTE Nombre', 'REMITENTE NOMBRE', 'Remitente Nombre', 'REMITENTE_NOMBRE']);
                const remApe = getVal(row, ['REMITENTE Apellidos', 'REMITENTE APELLIDOS', 'Remitente Apellidos', 'REMITENTE_APELLIDOS']);
                const destNom = getVal(row, ['DESTINATARIO Nombre', 'DESTINATARIO NOMBRE', 'Destinatario Nombre', 'DESTINATARIO_NOMBRE']);
                const destApe = getVal(row, ['DESTINATARIO Apellidos', 'DESTINATARIO APELLIDOS', 'Destinatario Apellidos', 'DESTINATARIO_APELLIDOS']);
                const idEntrada = getVal(row, ['ID de entrada', 'ID DE ENTRADA', 'ID entrada', 'ID', 'ID_ENTRADA']) || 'N/A';
                const fileUrl = getVal(row, ['carta', 'CARTA', 'Carta', 'URL', 'url']);

                const remitente = `${remNom} ${remApe}`.trim() || 'No especificado';
                const destinatario = `${destNom} ${destApe}`.trim() || 'No especificado';

                logStatus(`\n[${i + 1}/${rowsData.length}] ID: ${idEntrada} | ${remitente} -> ${destinatario}`);

                if (!fileUrl) {
                    logStatus(`  ⚠️ Registro omitido: No tiene URL de carta asociada.`);
                    totalOmitidos++;
                    continue;
                }

                try {
                    let buffer = null;
                    try {
                        buffer = await descargarConFallbacks(fileUrl);
                    } catch (dlErr) {
                        // Fallback especial para imágenes mediante etiqueta <img> si los proxies son bloqueados
                        logStatus(`  ⚠️ Proxy bloqueado. Intentando decodificación directa por canvas...`);
                        const canvasDataUrl = await intentarCargaCanvasImagen(fileUrl);
                        if (canvasDataUrl) {
                            const imgEmbed = await mergedPdf.embedPng(canvasDataUrl);
                            const page = mergedPdf.addPage([imgEmbed.width, imgEmbed.height]);
                            page.drawImage(imgEmbed, { x: 0, y: 0, width: imgEmbed.width, height: imgEmbed.height });
                            stampHeader(page, remitente, destinatario, idEntrada, position);
                            logStatus(`  ✅ Imagen rescatada e integrada mediante canvas.`);
                            totalExitosos++;
                            continue;
                        } else {
                            throw dlErr;
                        }
                    }

                    if (!buffer || buffer.byteLength < 10) {
                        throw new Error("El archivo descargado está vacío o no es accesible.");
                    }

                    const esPDF = comprobarSiEsPDF(buffer);
                    const urlLower = fileUrl.toLowerCase();

                    if (esPDF) {
                        const loadedPdf = await PDFLib.PDFDocument.load(buffer, { ignoreEncryption: true });
                        const pageIndices = loadedPdf.getPageIndices();
                        const copiedPages = await mergedPdf.copyPages(loadedPdf, pageIndices);
                        
                        copiedPages.forEach(page => {
                            stampHeader(page, remitente, destinatario, idEntrada, position);
                            mergedPdf.addPage(page);
                        });

                        logStatus(`  ✅ PDF procesado e integrado exitosamente (${copiedPages.length} pág).`);
                        totalExitosos++;

                    } else if (urlLower.includes('.docx')) {
                        const hiddenRender = document.getElementById('hiddenWordRender');
                        const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
                        hiddenRender.innerHTML = result.value;

                        const canvas = await html2canvas(hiddenRender, { scale: 1.5 });
                        const imgDataUrl = canvas.toDataURL('image/png');
                        const imgEmbed = await mergedPdf.embedPng(imgDataUrl);

                        const page = mergedPdf.addPage([canvas.width, canvas.height]);
                        page.drawImage(imgEmbed, { x: 0, y: 0, width: canvas.width, height: canvas.height });
                        stampHeader(page, remitente, destinatario, idEntrada, position);

                        logStatus(`  ✅ Documento Word (.docx) procesado e integrado.`);
                        totalExitosos++;

                    } else {
                        // Tratar como imagen (PNG / JPG / WEBP)
                        const imgDataUrl = await bufferToDataUrl(buffer);
                        let imgEmbed;
                        if (imgDataUrl.startsWith('data:image/jpeg')) {
                            imgEmbed = await mergedPdf.embedJpg(imgDataUrl);
                        } else {
                            imgEmbed = await mergedPdf.embedPng(imgDataUrl);
                        }

                        const page = mergedPdf.addPage([imgEmbed.width, imgEmbed.height]);
                        page.drawImage(imgEmbed, { x: 0, y: 0, width: imgEmbed.width, height: imgEmbed.height });
                        stampHeader(page, remitente, destinatario, idEntrada, position);

                        logStatus(`  ✅ Imagen convertida e integrada al PDF.`);
                        totalExitosos++;
                    }

                } catch (itemErr) {
                    logStatus(`  ❌ No se pudo descargar este archivo por bloqueos del servidor.`);
                    logStatus(`     URL del archivo: ${fileUrl}`);
                    totalOmitidos++;
                }
            }

            // Resumen final
            logStatus(`\n--------------------------------------------------`);
            logStatus(`Proceso completado. Éxitos: ${totalExitosos} | Omitidos/Bloqueados: ${totalOmitidos}`);

            if (totalExitosos > 0) {
                try {
                    logStatus('Generando el archivo PDF consolidado final...');
                    const pdfBytes = await mergedPdf.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const finalUrl = URL.createObjectURL(blob);

                    downloadBtn.href = finalUrl;
                    downloadBtn.download = `Cartas_Consolidadas_${Date.now()}.pdf`;
                    downloadSummary.innerText = `Se consolidaron exitosamente ${totalExitosos} de ${rowsData.length} cartas.`;

                    statusTitle.innerText = "¡Proceso Concluido!";
                    downloadCard.classList.remove('hidden');
                } catch (saveErr) {
                    logStatus(`❌ Error generando el archivo final: ${saveErr.message}`);
                }
            } else {
                statusTitle.innerText = "Error de Acceso a las URLs";
                alert("El servidor bloqueó el acceso a todas las URLs. Revisa la consola.");
            }

            processBtn.disabled = false;
        });

        function getVal(row, keys) {
            for (let k of keys) {
                if (row[k] !== undefined && row[k] !== null) return String(row[k]).trim();
            }
            return '';
        }

        function comprobarSiEsPDF(buffer) {
            if (!buffer || buffer.byteLength < 5) return false;
            const uint8 = new Uint8Array(buffer.slice(0, 5));
            return uint8[0] === 0x25 && uint8[1] === 0x50 && uint8[2] === 0x44 && uint8[3] === 0x46; // %PDF
        }

        // Descarga robusta multicanal con 6 proxies de respaldo
        async function descargarConFallbacks(urlOriginal) {
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(urlOriginal)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(urlOriginal)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlOriginal)}`,
                `https://thingproxy.freeboard.io/fetch/${urlOriginal}`,
                `https://proxy.cors.sh/${urlOriginal}`,
                urlOriginal
            ];

            for (let targetUrl of proxies) {
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        const buf = await res.arrayBuffer();
                        if (buf.byteLength > 100 && !esRespuestaHTML(buf)) {
                            return buf;
                        }
                    }
                } catch (e) {
                    // Intenta con el siguiente proxy si el actual falla
                }
            }
            throw new Error("Servidor bloqueado por Anti-Bot/CORS.");
        }

        function esRespuestaHTML(buffer) {
            if (!buffer || buffer.byteLength < 20) return true;
            const arr = new Uint8Array(buffer.slice(0, 20));
            let str = "";
            for (let i = 0; i < arr.length; i++) {
                str += String.fromCharCode(arr[i]);
            }
            str = str.toLowerCase();
            return str.includes('<html') || str.includes('<!doctype') || str.includes('<head');
        }

        function intentarCargaCanvasImagen(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch (e) {
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null);
                img.src = url + "?v=" + Date.now();
            });
        }

        function bufferToDataUrl(buffer) {
            return new Promise((resolve, reject) => {
                const blob = new Blob([buffer]);
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Error procesando imagen."));
                reader.readAsDataURL(blob);
            });
        }

        function stampHeader(page, remitente, destinatario, idEntrada, position) {
            const { width, height } = page.getSize();
            const fontSize = 10;
            const lineHeight = 13;

            let x = 20;
            let y = height - 20;

            if (position.includes('right')) x = Math.max(20, width - 240);
            if (position.includes('bottom')) y = 60;

            page.drawRectangle({
                x: x - 5,
                y: y - (lineHeight * 2) - 8,
                width: 235,
                height: (lineHeight * 3) + 10,
                color: PDFLib.rgb(1, 1, 1),
                opacity: 0.95,
                borderColor: PDFLib.rgb(0.6, 0.6, 0.6),
                borderWidth: 1,
            });

            page.drawText(`ID Entrada: ${idEntrada}`, { x, y, size: fontSize, color: PDFLib.rgb(0, 0, 0) });
            page.drawText(`Remitente: ${remitente}`, { x, y: y - lineHeight, size: fontSize, color: PDFLib.rgb(0.1, 0.1, 0.1) });
            page.drawText(`Destinatario: ${destinatario}`, { x, y: y - (lineHeight * 2), size: fontSize, color: PDFLib.rgb(0.1, 0.1, 0.1) });
        }

        function logStatus(msg) {
            statusText.innerText += msg + '\n';
            statusText.scrollTop = statusText.scrollHeight;
        }
    </script>
</body>
</html>
