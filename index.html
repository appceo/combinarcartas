<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combinador de PDF Consolidado</title>
  <!-- Librerías requeridas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 100px; margin-top: 10px; font-family: monospace; }
    button { background-color: #00a65a; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #logConsole { background: #0a1128; color: #00ff88; font-family: monospace; padding: 15px; height: 250px; overflow-y: auto; border-radius: 6px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>1. Pegar URLs de los PDF (una por línea) o datos de la tabla</h2>
    <p>Pega directamente las URLs del servidor <code>igleco.com</code> o el listado de enlaces:</p>
    <textarea id="txtUrls" placeholder="https://igleco.com/wp-content/uploads/2024/01/documento1.pdf&#10;https://igleco.com/wp-content/uploads/2024/01/documento2.pdf"></textarea>
  </div>

  <div class="card">
    <h2>2. Generar Paquete PDF Consolidado</h2>
    <button id="btnProcesar" onclick="iniciarProcesamiento()">Procesar y Crear PDF Consolidado</button>
    <div id="logConsole">> Sistema listo. Ingrese las URLs o presione procesar si la tabla ya está cargada.</div>
  </div>

  <script>
    const PROXIES = [
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    function log(msg) {
      const consoleDiv = document.getElementById("logConsole");
      consoleDiv.innerHTML += `<div>> ${msg}</div>`;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    async function descargarPDFConTimeout(url) {
      // Intento 1: Descarga directa
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeout);
        if (res.ok) return await res.arrayBuffer();
      } catch (e) {}

      // Intento 2: Mediante Proxies para evitar bloqueo de GitHub Pages / CORS
      for (const proxyFn of PROXIES) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(proxyFn(url), { signal: controller.signal });
          clearTimeout(timeout);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf && buf.byteLength > 100) return buf;
          }
        } catch (e) {}
      }
      throw new Error("No se pudo obtener el archivo por restricciones de red/CORS");
    }

    async function obtenerListaURLs() {
      let urls = [];
      
      // 1. Verificar si hay datos en el cuadro de texto
      const txt = document.getElementById("txtUrls").value.trim();
      if (txt.length > 0) {
        urls = txt.split("\n").map(u => u.trim()).filter(u => u.startsWith("http"));
      }

      // 2. Si no hay en el cuadro de texto, buscar en las tablas HTML existentes en la página
      if (urls.length === 0) {
        const links = document.querySelectorAll("a[href*='.pdf'], td");
        links.forEach(l => {
          const href = l.href || l.innerText;
          if (href && href.startsWith("http") && href.includes(".pdf")) {
            urls.push(href.trim());
          }
        });
      }

      return [...new Set(urls)]; // Eliminar duplicados
    }

    async function iniciarProcesamiento() {
      const btn = document.getElementById("btnProcesar");
      btn.disabled = true;
      log("Iniciando análisis de enlaces...");

      const listaPDFs = await obtenerListaURLs();

      if (listaPDFs.length === 0) {
        log("❌ ERROR: No se encontraron enlaces a archivos PDF en la tabla ni en el campo de texto.");
        log("Por favor, pega las URLs directamente en el recuadro superior.");
        btn.disabled = false;
        return;
      }

      log(`Se detectaron ${listaPDFs.length} archivos para consolidar.`);

      try {
        const pdfFinal = await PDFLib.PDFDocument.create();
        let exito = 0;

        for (let i = 0; i < listaPDFs.length; i++) {
          const url = listaPDFs[i];
          log(`Procesando (${i + 1}/${listaPDFs.length}): ${url.substring(0, 60)}...`);

          // Permitir renderizado de la consola de mensajes
          await new Promise(r => setTimeout(r, 100));

          try {
            const buffer = await descargarPDFConTimeout(url);
            const pdfDoc = await PDFLib.PDFDocument.load(buffer);
            const paginas = await pdfFinal.copyPages(pdfDoc, pdfDoc.getPageIndices());
            paginas.forEach(p => pdfFinal.addPage(p));
            exito++;
            log(`  ✓ Documento ${i + 1} consolidado.`);
          } catch (err) {
            log(`  ⚠ No se pudo procesar el archivo ${i + 1}. Generando página de aviso...`);
            const pageErr = pdfFinal.addPage([600, 400]);
            pageErr.drawText(`Error al cargar el documento #${i + 1}`, { x: 50, y: 300, size: 16 });
            pageErr.drawText(`URL: ${url}`, { x: 50, y: 260, size: 10 });
          }
        }

        log("Generando archivo consolidado final...");
        const pdfBytes = await pdfFinal.save();
        download(pdfBytes, "PDF_Consolidado.pdf", "application/pdf");
        log("✅ ¡PROCESO FINALIZADO! El archivo se ha descargado correctamente.");

      } catch (e) {
        log(`❌ Error crítico durante la consolidación: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
