<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unificador de Cartas desde ZIP</title>
    
    <!-- JSZip para descomprimir archivos ZIP en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- PDF-Lib para manipulacion y generacion del PDF final -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { margin-top: 0; color: #0f172a; font-size: 1.75rem; margin-bottom: 8px; }
        p.subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }

        input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;
        }

        button {
            width: 100%; background-color: var(--primary-color); color: white;
            border: none; padding: 14px; font-size: 1rem; font-weight: 600;
            border-radius: 6px; cursor: pointer; transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .status-box { margin-top: 24px; padding: 16px; border-radius: 6px; background-color: #f1f5f9; display: none; }
        .progress-bar-container { width: 100%; background-color: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background-color: var(--primary-color); transition: width 0.2s; }
        .log-list {
            margin-top: 12px; max-height: 200px; overflow-y: auto; font-family: monospace;
            font-size: 0.85rem; color: #334155; background: #fff; padding: 8px;
            border: 1px solid var(--border-color); border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Unificador de Cartas (Paso 2)</h1>
    <p class="subtitle">Seleccione el archivo .ZIP comprimido que contiene las cartas para generar el PDF unificado.</p>

    <div class="form-group">
        <label for="zipFile">Archivo ZIP con los Documentos</label>
        <input type="file" id="zipFile" accept=".zip">
    </div>

    <button id="processBtn" onclick="procesarZip()">Descomprimir y Generar PDF</button>

    <div id="statusBox" class="status-box">
        <span id="statusText">Iniciando proceso...</span>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="logList" class="log-list"></div>
    </div>
</div>

<script>
    function log(mensaje) {
        const logList = document.getElementById('logList');
        const entry = document.createElement('div');
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${mensaje}`;
        logList.appendChild(entry);
        logList.scrollTop = logList.scrollHeight;
    }

    function actualizarProgreso(porcentaje, texto) {
        document.getElementById('progressBar').style.width = `${porcentaje}%`;
        if (texto) {
            document.getElementById('statusText').textContent = texto;
            log(texto);
        }
    }

    async function procesarZip() {
        const zipInput = document.getElementById('zipFile').files[0];
        const btn = document.getElementById('processBtn');

        if (!zipInput) {
            alert("Por favor seleccione un archivo .ZIP.");
            return;
        }

        btn.disabled = true;
        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('logList').innerHTML = '';
        actualizarProgreso(0, "Leyendo archivo ZIP en memoria...");

        try {
            const zip = new JSZip();
            const zipContent = await zip.loadAsync(zipInput);
            
            const archivos = [];
            zipContent.forEach((relativePath, zipEntry) => {
                if (!zipEntry.dir) {
                    archivos.push(zipEntry);
                }
            });

            log(`Se encontraron ${archivos.length} archivos dentro del ZIP.`);

            const pdfUnificado = await PDFLib.PDFDocument.create();
            const helveticaFont = await pdfUnificado.embedFont(PDFLib.StandardFonts.HelveticaBold);

            for (let i = 0; i < archivos.length; i++) {
                const archivo = archivos[i];
                const nombreArchivo = archivo.name.split('/').pop();
                
                const porcentaje = Math.round(((i) / archivos.length) * 100);
                actualizarProgreso(porcentaje, `Procesando (${i + 1}/${archivos.length}): ${nombreArchivo}...`);

                // Formato esperado: ID_Remitente_Destinatario.ext
                const partes = nombreArchivo.replace(/\.[^/.]+$/, "").split('_');
                const idEntrada = partes[0] || 'N/A';
                const remitente = partes[1] || 'Sin Nombre';
                const destinatario = partes[2] || 'Sin Nombre';

                const textoEtiqueta = `ID Entrada: ${idEntrada} | Remitente: ${remitente} | Destinatario: ${destinatario}`;

                const arrayBuffer = await archivo.async("arraybuffer");
                const extension = nombreArchivo.split('.').pop().toLowerCase();

                if (extension === 'pdf') {
                    const pdfFuente = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const paginasCopiadas = await pdfUnificado.copyPages(pdfFuente, pdfFuente.getPageIndices());

                    paginasCopiadas.forEach(pagina => {
                        pdfUnificado.addPage(pagina);
                        const { width } = pagina.getSize();
                        
                        pagina.drawRectangle({
                            x: 0, y: 0, width: width, height: 25,
                            color: PDFLib.rgb(0.93, 0.93, 0.93), opacity: 0.95
                        });

                        pagina.drawText(textoEtiqueta, {
                            x: 12, y: 8, size: 8.5,
                            font: helveticaFont, color: PDFLib.rgb(0.1, 0.1, 0.1)
                        });
                    });

                } else if (['jpg', 'jpeg', 'png'].includes(extension)) {
                    let imagenEmbed;
                    if (extension === 'png') {
                        imagenEmbed = await pdfUnificado.embedPng(arrayBuffer);
                    } else {
                        imagenEmbed = await pdfUnificado.embedJpg(arrayBuffer);
                    }

                    const pagina = pdfUnificado.addPage([imagenEmbed.width, imagenEmbed.height + 30]);
                    pagina.drawImage(imagenEmbed, {
                        x: 0, y: 30, width: imagenEmbed.width, height: imagenEmbed.height
                    });

                    pagina.drawRectangle({
                        x: 0, y: 0, width: imagenEmbed.width, height: 30,
                        color: PDFLib.rgb(0.93, 0.93, 0.93)
                    });

                    pagina.drawText(textoEtiqueta, {
                        x: 15, y: 10, size: 9.5,
                        font: helveticaFont, color: PDFLib.rgb(0.1, 0.1, 0.1)
                    });
                }
            }

            actualizarProgreso(98, "Compilando PDF unificado final...");
            const pdfBytes = await pdfUnificado.save();

            const blobFinal = new Blob([pdfBytes], { type: 'application/pdf' });
            const linkDescarga = document.createElement('a');
            linkDescarga.href = URL.createObjectURL(blobFinal);
            linkDescarga.download = `Cartas_Unificadas_${new Date().toISOString().slice(0,10)}.pdf`;
            document.body.appendChild(linkDescarga);
            linkDescarga.click();
            document.body.removeChild(linkDescarga);

            actualizarProgreso(100, "¡Proceso completado con éxito!");

        } catch (error) {
            actualizarProgreso(0, `Error general: ${error.message}`);
            log(`CRÍTICO: ${error.message}`);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
