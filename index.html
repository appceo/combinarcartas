<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de PDF Consolidado</title>
  <!-- Librerías para manipulación de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>
</head>
<body>

  <button id="btnProcesar" onclick="procesarYCrearPDFConsolidado()">
    Procesar y Crear PDF Consolidado
  </button>

  <div id="status">Procesando...</div>
  <div id="logConsole" style="background: #0a1128; color: #00ff88; font-family: monospace; padding: 15px; height: 250px; overflow-y: auto;">
    > Esperando inicio del proceso...
  </div>

  <script>
    // Lista de proxies CORS públicos para reintentos automáticos
    const CORS_PROXIES = [
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://thingproxy.freeboard.io/fetch/${url}`,
      url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    ];

    function logMessage(texto) {
      const consoleDiv = document.getElementById("logConsole");
      consoleDiv.innerHTML += `<div>> ${texto}</div>`;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // Función para descargar un arrayBuffer con timeout estricto de 5 segundos por proxy
    async function fetchConTimeout(url, timeoutMs = 5000) {
      // 1. Intento directo
      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        const resp = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (resp.ok) return await resp.arrayBuffer();
      } catch (e) {
        // Falló directo, continuamos con proxies
      }

      // 2. Intentos con lista de proxies
      for (const proxyFn of CORS_PROXIES) {
        try {
          const targetUrl = proxyFn(url);
          const controller = new AbortController();
          const id = setTimeout(() => controller.abort(), timeoutMs);
          const resp = await fetch(targetUrl, { signal: controller.signal });
          clearTimeout(id);
          if (resp.ok) {
            const buffer = await resp.arrayBuffer();
            if (buffer && buffer.byteLength > 0) return buffer;
          }
        } catch (e) {
          // Si expira o falla, intenta el siguiente proxy inmediatamente
        }
      }
      throw new Error("No se pudo obtener el archivo mediante ningún método o proxy.");
    }

    async function procesarYCrearPDFConsolidado() {
      const btn = document.getElementById("btnProcesar");
      btn.disabled = true;
      logMessage("Iniciando proceso de consolidación...");

      // Supongamos que esta es tu lista de datos extraída de la tabla
      // Reemplaza 'registros' con tu variable o arreglo de datos real
      const registros = Array.from(document.querySelectorAll("tbody tr")).map(tr => {
        const cols = tr.querySelectorAll("td");
        return {
          id: cols[1]?.innerText?.trim() || "N/A",
          remitente: cols[2]?.innerText?.trim() || "Desconocido",
          destinatario: cols[3]?.innerText?.trim() || "Desconocido",
          url: cols[4]?.querySelector("a")?.href || cols[4]?.innerText?.trim()
        };
      }).filter(r => r.url && r.url.startsWith("http"));

      if (registros.length === 0) {
        logMessage("Error: No se encontraron registros válidos con URL.");
        btn.disabled = false;
        return;
      }

      logMessage(`Se detectaron ${registros.length} registros para procesar.`);

      try {
        const pdfConsolidado = await PDFLib.PDFDocument.create();

        for (let i = 0; i < registros.length; i++) {
          const item = registros[i];
          logMessage(`Procesando (${i + 1}/${registros.length}) - ID: ${item.id}...`);

          // Permitir que el navegador actualice el DOM antes de la siguiente descarga
          await new Promise(r => setTimeout(r, 100));

          try {
            const buffer = await fetchConTimeout(item.url, 5000);
            const pdfSub = await PDFLib.PDFDocument.load(buffer);
            const paginasCopiadas = await pdfConsolidado.copyPages(pdfSub, pdfSub.getPageIndices());
            paginasCopiadas.forEach(page => pdfConsolidado.addPage(page));
            logMessage(`✓ ID ${item.id}: Agregado exitosamente.`);
          } catch (err) {
            logMessage(`⚠ ID ${item.id}: Error al descargar (${err.message}). Creando página de notificación...`);
            
            // Si el archivo falla o da timeout, crea una página informativa en vez de detener todo el programa
            const errorPage = pdfConsolidado.addPage([600, 400]);
            errorPage.drawText(`No se pudo consolidar el documento ID: ${item.id}`, { x: 50, y: 320, size: 16 });
            errorPage.drawText(`Remitente: ${item.remitente}`, { x: 50, y: 280, size: 12 });
            errorPage.drawText(`Destinatario: ${item.destinatario}`, { x: 50, y: 260, size: 12 });
            errorPage.drawText(`URL de origen: ${item.url}`, { x: 50, y: 240, size: 10 });
            errorPage.drawText(`Motivo: El servidor no respondió a tiempo o bloqueó el acceso.`, { x: 50, y: 200, size: 10 });
          }
        }

        logMessage("Finalizando y generando archivo PDF consolidado...");
        const pdfBytes = await pdfConsolidado.save();
        download(pdfBytes, "Paquete_PDF_Consolidado.pdf", "application/pdf");
        logMessage("¡Proceso completado exitosamente! El archivo se ha descargado.");

      } catch (e) {
        logMessage(`Error crítico en la ejecución: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
