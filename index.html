<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unificador de Cartas y Documentos</title>
    
    <!-- PapaParse para procesamiento eficiente de CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- PDF-Lib para manipulacion y unificacion rápida de documentos PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    
    <!-- PDF.js para renderizar/convertir páginas PDF a imágenes si es necesario -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="url"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .divider span {
            background-color: var(--card-bg);
            padding: 0 12px;
            position: relative;
            z-index: 2;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 6px;
            background-color: #f1f5f9;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .log-list {
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #334155;
            background: #fff;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Unificador de Cartas y Documentos</h1>
    <p class="subtitle">Ingrese la URL o cargue la tabla CSV para unificar los documentos e incluir etiquetas con remitente, destinatario e ID de entrada[cite: 1].</p>

    <div class="form-group">
        <label for="csvUrl">URL de la Tabla de Datos (CSV / Publicado)</label>
        <input type="url" id="csvUrl" placeholder="https://ejemplo.com/tabla_cartas.csv">
    </div>

    <div class="divider"><span>O CARGAR ARCHIVO LOCAL</span></div>

    <div class="form-group">
        <label for="csvFile">Archivo CSV de la Tabla de Datos</label>
        <input type="file" id="csvFile" accept=".csv, .txt">
    </div>

    <button id="processBtn" onclick="procesarDocumentos()">Generar PDF Unificado</button>

    <div id="statusBox" class="status-box">
        <span id="statusText">Iniciando proceso...</span>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="logList" class="log-list"></div>
    </div>
</div>

<script>
    // Configurar worker de PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function log(mensaje) {
        const logList = document.getElementById('logList');
        const entry = document.createElement('div');
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${mensaje}`;
        logList.appendChild(entry);
        logList.scrollTop = logList.scrollHeight;
    }

    function actualizarProgreso(porcentaje, texto) {
        document.getElementById('progressBar').style.width = `${porcentaje}%`;
        if (texto) {
            document.getElementById('statusText').textContent = texto;
            log(texto);
        }
    }

    async function procesarDocumentos() {
        const csvUrl = document.getElementById('csvUrl').value.trim();
        const csvFileInput = document.getElementById('csvFile').files[0];
        const btn = document.getElementById('processBtn');

        if (!csvUrl && !csvFileInput) {
            alert("Por favor ingrese una URL de tabla CSV o seleccione un archivo local.");
            return;
        }

        btn.disabled = true;
        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('logList').innerHTML = '';
        actualizarProgreso(0, "Obteniendo datos de la tabla...");

        try {
            let csvContent = "";
            if (csvFileInput) {
                csvContent = await csvFileInput.text();
            } else {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error("No se pudo descargar el archivo CSV desde la URL especificada.");
                csvContent = await response.text();
            }

            // Procesar CSV usando PapaParse
            const parseResult = PapaParse.parse(csvContent, {
                header: true,
                skipEmptyLines: true,
                transformHeader: h => h.trim().toUpperCase()
            });

            const registros = parseResult.data;
            if (!registros || registros.length === 0) {
                throw new Error("La tabla de datos no contiene registros válidos.");
            }

            log(`Se encontraron ${registros.length} registros para procesar.`);

            // Crear documento PDF final unificado
            const pdfUnificado = await PDFLib.PDFDocument.create();
            const helveticaFont = await pdfUnificado.embedFont(PDFLib.StandardFonts.HelveticaBold);

            for (let i = 0; i < registros.length; i++) {
                const fila = registros[i];
                
                // Extraer campos (buscando variaciones comunes de nombre de columna)
                const idEntrada = fila['ID DE ENTRADA'] || fila['ID ENTRADA'] || fila['ID'] || `Reg-${i+1}`;
                const nombreDest = fila['NOMBRE DESTINATARIO'] || '';
                const apellidoDest = fila['APELLIDO DESTINATARIO'] || fila['APELLIDOS DESTINATARIO'] || '';
                const nombreRem = fila['NOMBRE REMITENTE'] || '';
                const apellidoRem = fila['APELLIDOS REMITENTE'] || fila['APELLIDO REMITENTE'] || '';
                const cartaUrl = fila['CARTA'] || fila['URL'] || fila['CARTA URL'];

                const destinatarioCompleto = `${nombreDest} ${apellidoDest}`.trim();
                const remitenteCompleto = `${nombreRem} ${apellidoRem}`.trim();

                const porcentaje = Math.round(((i) / registros.length) * 100);
                actualizarProgreso(porcentaje, `Procesando registro ${i + 1} de ${registros.length} (ID: ${idEntrada})...`);

                if (!cartaUrl) {
                    log(`ADVERTENCIA: El registro ID ${idEntrada} no tiene URL de carta. Se omitirá.`);
                    continue;
                }

                try {
                    // Descargar el documento (PDF o Imagen) temporalmente a memoria Blob/Buffer
                    const docResp = await fetch(cartaUrl);
                    if (!docResp.ok) throw new Error(`HTTP Error ${docResp.status}`);
                    
                    const blob = await docResp.blob();
                    const arrayBuffer = await blob.arrayBuffer();
                    const contentType = docResp.headers.get('content-type') || '';

                    const isPdf = cartaUrl.toLowerCase().endsWith('.pdf') || contentType.includes('pdf');
                    const isImage = cartaUrl.toLowerCase().match(/\.(jpeg|jpg|png)$/) || contentType.includes('image');

                    const textoEtiqueta = `ID Entrada: ${idEntrada} | Remitente: ${remitenteCompleto} | Destinatario: ${destinatarioCompleto}`;

                    if (isPdf) {
                        // Importar páginas del PDF original directamente
                        const pdfFuente = await PDFLib.PDFDocument.load(arrayBuffer);
                        const paginasCopiadas = await pdfUnificado.copyPages(pdfFuente, pdfFuente.getPageIndices());

                        paginasCopiadas.forEach(pagina => {
                            pdfUnificado.addPage(pagina);
                            const { width, height } = pagina.getSize();
                            
                            // Agregar etiqueta inferior
                            pagina.drawRectangle({
                                x: 0,
                                y: 0,
                                width: width,
                                height: 25,
                                color: PDFLib.rgb(0.95, 0.95, 0.95),
                                opacity: 0.9
                            });

                            pagina.drawText(textoEtiqueta, {
                                x: 15,
                                y: 8,
                                size: 9,
                                font: helveticaFont,
                                color: PDFLib.rgb(0.1, 0.1, 0.1)
                            });
                        });

                    } else if (isImage) {
                        // Insertar Imagen (JPG / PNG)
                        let imagenEmbed;
                        if (cartaUrl.toLowerCase().endsWith('.png') || contentType.includes('png')) {
                            imagenEmbed = await pdfUnificado.embedPng(arrayBuffer);
                        } else {
                            imagenEmbed = await pdfUnificado.embedJpg(arrayBuffer);
                        }

                        // Crear nueva página del tamaño de la imagen o estándar A4
                        const pagina = pdfUnificado.addPage([imagenEmbed.width, imagenEmbed.height + 30]);
                        pagina.drawImage(imagenEmbed, {
                            x: 0,
                            y: 30,
                            width: imagenEmbed.width,
                            height: imagenEmbed.height,
                        });

                        // Agregar etiqueta inferior
                        pagina.drawRectangle({
                            x: 0,
                            y: 0,
                            width: imagenEmbed.width,
                            height: 30,
                            color: PDFLib.rgb(0.95, 0.95, 0.95)
                        });

                        pagina.drawText(textoEtiqueta, {
                            x: 15,
                            y: 10,
                            size: 10,
                            font: helveticaFont,
                            color: PDFLib.rgb(0.1, 0.1, 0.1)
                        });

                    } else {
                        log(`Formato no soportado para ID ${idEntrada}: ${cartaUrl}`);
                    }

                } catch (err) {
                    log(`ERROR al procesar documento para ID ${idEntrada}: ${err.message}`);
                }
            }

            actualizarProgreso(95, "Compilando archivo PDF final unificado...");
            const pdfBytes = await pdfUnificado.save();

            // Generar la descarga automática
            const blobFinal = new Blob([pdfBytes], { type: 'application/pdf' });
            const linkDescarga = document.createElement('a');
            linkDescarga.href = URL.createObjectURL(blobFinal);
            linkDescarga.download = `Cartas_Unificadas_${new Date().toISOString().slice(0,10)}.pdf`;
            document.body.appendChild(linkDescarga);
            linkDescarga.click();
            document.body.removeChild(linkDescarga);

            actualizarProgreso(100, "¡Proceso completado con éxito! El PDF se ha generado y descargado.");

        } catch (error) {
            actualizarProgreso(0, `Error general: ${error.message}`);
            log(`CRÍTICO: ${error.message}`);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
